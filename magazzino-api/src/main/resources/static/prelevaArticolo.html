<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Verifica IdArticolo</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <div class="header-section">
        <a href="/">Home</a>
        <h1>Preleva Articolo</h1>
    </div>
    <div class="horizontal-line"></div>
    <div class="form-container">
        <div class="form-row">
            <label for="codiceInterno">Inserisci Codice Interno</label>
            <input type="text" id="codiceInterno" name="codice_interno" required>
        </div>
        <button type="button" id="submitIdMovimento">Invia</button>

    </div>
    <br>
    <div class="message-container">
        <div id="result">
            <p><strong>Messaggio:</strong></p>
        </div>
    </div>

    <script>
        document.getElementById("submitIdMovimento").addEventListener("click", function () {
            const risultato = document.getElementById("result");
            const parametri = new URLSearchParams({
                codiceInterno: document.getElementById("codiceInterno").value
            });

            fetch("/movimenti/uscita?" + parametri, { method: "PUT" })
                .then(response => response.text())
                .then(testo => { risultato.textContent = testo; })
                .catch(error => { risultato.textContent = "Errore: " + error.message; });
        });
    </script>
</body>

</html>
