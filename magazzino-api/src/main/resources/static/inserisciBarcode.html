<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Verifica IdArticolo</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <div class="header-section">
        <a href="/">Home</a>
        <h1>Ingresso articoli</h1>
    </div>
    <div class="horizontal-line"></div>
    <div class="form-container">
        <div class="form-row">
            <label for="barcode">Inserisci BarCode:</label>
            <input type="text" id="barcode" name="barcode" required>
        </div>
        <button id="submitBtn" type="button">Invia</button>

    </div>
    <br>
    <div class="message-container">
        <div id="message">
            <p><strong>Messaggio:</strong></p>
        </div>
    </div>
    <script>
        document.getElementById("submitBtn").addEventListener("click", function () {
            const barcode = document.getElementById("barcode").value;
            const contenitore = document.getElementById("message");

            fetch("/movimenti/entrata", {
                method: "POST",
                headers: { "Accept": "application/json", "Content-Type": "application/json" },
                body: JSON.stringify({ barcode: barcode })
            })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(testo => {
                            throw new Error(testo || "Errore " + response.status);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    const campi = ["idLocazione", "corsia", "colonna", "ripiano", "idMovimento", "codiceInterno"];
                    const lista = document.createElement("ul");
                    campi.forEach(campo => {
                        const voce = document.createElement("li");
                        const etichetta = document.createElement("strong");
                        etichetta.textContent = campo + ": ";
                        voce.append(etichetta, String(data[campo]));
                        lista.appendChild(voce);
                    });
                    contenitore.replaceChildren(lista);
                })
                .catch(error => {
                    contenitore.textContent = "Errore: " + error.message;
                });
        });
    </script>
</body>

</html>
