<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Inserisci nuovo articolo</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <div class="header-section">
        <a href="/">Home</a>
        <h1>Inserisci nuovo articolo</h1>
    </div>
    <div class="horizontal-line"></div>
    <div class="form-container">
        <div class="form-row">
            <label for="descrizione">Descrizione:</label>
            <input type="text" id="descrizione" name="descrizione">
        </div>
        <div class="form-row">
            <label for="barcode">BarCode:</label>
            <input type="text" id="barcode" name="barcode">
        </div>
        <button onclick="inviaDati()">Salva</button>
    </div>
    <br>
    <div class="message-container">
        <p><strong>Messaggio:</strong> <span id="messaggio"></span></p>
    </div>

    <script>
        function inviaDati() {
            const descrizione = document.getElementById("descrizione").value;
            const barcode = document.getElementById("barcode").value;
            const messaggio = document.getElementById("messaggio");

            fetch("/barcode", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ descrizione: descrizione, barcode: barcode })
            })
                .then(response => response.text().then(testo => {
                    if (!response.ok) {
                        throw new Error(testo || "Errore durante il salvataggio");
                    }
                    return testo;
                }))
                .then(testo => {
                    messaggio.textContent = testo;
                    setTimeout(() => { messaggio.textContent = ""; }, 3000);
                })
                .catch(error => {
                    messaggio.textContent = error.message;
                });
        }
    </script>
</body>

</html>
